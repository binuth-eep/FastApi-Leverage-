const SIM='SIMULATION ONLY — මෙය අධ්‍යාපනික Demo එකකි. සැබෑ Python Backend එකක් හෝ PostgreSQL Database එකක් ක්‍රියාත්මක නොවේ.';

function addFile(name,layer,purpose,caller,signature,annotated){const rows=annotated.trim().split('\n').map(x=>{const i=x.indexOf(' § ');return i<0?[x,'හිස් පේළිය මඟින් code කොටස් වෙන් කර කියවීම පහසු කරයි.']:[x.slice(0,i),x.slice(i+3)]});FILES[name]={name,layer,purpose,caller,signature,lines:rows.map(x=>x[0]),notes:rows.map(x=>x[1])};}

addFile('main.py','Application','FastAPI application එක සහ Router එක එකතු කරන ප්‍රවේශ ස්ථානය.','ASGI server','FastAPI → app',`

from routers.auth_router import router § auth_router.py හි Router එක import කරයි.

app = FastAPI(title="Student API") § OpenAPI ලේඛන සඳහා නමක් සහිත application object එකක් සාදයි.
app.include_router(router) § වෙනම ගොනුවක ඇති endpoints application එකට ලියාපදිංචි කරයි.

@app.get("/") § GET / request එක පහත function එකට සම්බන්ධ කරන decorator එකයි.
def home() -> dict[str, str]: § සරල synchronous function එක dictionary එකක් ආපසු ලබා දෙයි.
    return {"message": "Welcome"} § FastAPI මෙම dictionary එක JSON response එකක් බවට පත් කරයි.
`);
addFile('database/session.py','Database','Engine, Session factory සහ request එකකට Session එකක් සපයන dependency.','dependencies/services.py','get_db() → Iterator[Session]',`
import os § environment variables කියවීමට Python standard library එක භාවිතා කරයි.
from collections.abc import Iterator § yield කරන function එකේ return type එක දැක්වීමට භාවිතා කරයි.
from sqlalchemy import create_engine § PostgreSQL connections කළමනාකරණය කරන Engine එක සෑදීමට import කරයි.
from sqlalchemy.orm import Session, sessionmaker § Session class එක සහ Session factory එක import කරයි.

engine = create_engine(os.environ["DATABASE_URL"], pool_pre_ping=True) § connection URL එක environment එකෙන් ගනියි; checkout කළ connection එක සජීවීදැයි පරීක්ෂා කරයි.
SessionLocal = sessionmaker(bind=engine, expire_on_commit=False) § එකම Engine එකට සම්බන්ධ Session objects සෑදීමේ factory එකයි. Commit පසු attributes නැවත expire නොකරයි.

['Bearer extraction · Verification','Authorization: Bearer <token> header එකෙන් token එක ලබා ගනියි. jwt.decode() server-controlled algorithms=["HS256"] සමග signature හා expiry verify කරයි. Token එකේ algorithm එක අන්ධව විශ්වාස නොකරයි. exp සහ sub required claims ලෙස පරීක්ෂා කරයි.'],

['Token handling · Expiry','Production secrets environment එකේ තබයි; short expiry භාවිතා කරයි; HTTPS හරහා tokens යවයි. Browser localStorage තුළ tokens තැබීම XSS exposure ඇති කරයි; HttpOnly cookies භාවිතා කරන්නේ නම් CSRF protections සහ same-site policy සලකන්න. මෙහි fake tokens memory එකේ පමණක් පවතී. Logout කිරීමෙන් stateless signed JWT එක වහාම revoke වන්නේ නැත; වෙනම revocation policy අවශ්‍යය.']

['Create the file · Direct dependencies','VS Code Explorer එකේ requirements.txt සාදා fastapi සහ uvicorn පේළි දෙකක ලියා Save කරන්න. මේවා starter app එක සෘජුව භාවිතා කරන Direct dependencies වේ. ඒවාට අවශ්‍ය වෙනත් packages pip විසින් install කළ හැක; ඒවා Transitive dependencies වේ. File එකේ Python imports, terminal prompts හෝ pip install යන commands ලියන්නේ නැත. මුල් file එකේ versions නොදක්වා ඇති නිසා install කරන version එක කාලය අනුව වෙනස් විය හැක.'],
['Install · Inspect · Freeze snapshot','python -m pip install -r requirements.txt හි -r කියන්නේ file එකෙන් ලැයිස්තුව කියවන්න කියන එකයි. python -m pip list දැනට install වී ඇති packages පෙන්වයි. python -m pip show fastapi එක package එකක තොරතුරු පෙන්වයි. python -m pip check declared dependency conflicts බලයි; app tests වෙනුවට නොවේ. Clean project environment එකේ python -m pip freeze > requirements.lock.txt යෙදීමෙන් installed versions snapshot එකක් සුරකියි. > ලකුණ දැනට ඇති file එක overwrite කරයි. pip freeze සම්පූර්ණ portable lockfile generator එකක් නොවේ; environment/platform අනුව ප්‍රතිඵල වෙනස් විය හැක.'],

['What is a JWT?','A JWT carries claims and a signature. Its payload is not automatically encrypted.','sub identity එකයි; exp කල් ඉකුත්වීමයි. Signature එක data වෙනස් කළාදැයි තහවුරු කරයි.','core/security.py','Can you safely place a password inside its payload?',15],
['How do you verify a JWT?','Use a trusted library to verify its signature, allowed algorithm, expiry, and required claims.','jwt.decode එක server-controlled algorithm සහ required exp/sub සමග භාවිතා කරයි. Payload decode පමණක් ප්‍රමාණවත් නැත.','dependencies/authentication.py','What should happen when the token expires?',15],
['Why use response schemas?','They define and validate public output and prevent accidental exposure of sensitive fields.','UserRead එකේ password හෝ hash නොමැති නිසා ORM object එකේ එම attributes response එකට යන්නේ නැත.','schemas/user.py','Does a response schema save an object?',7],
['What happens after a constraint failure?','The operation fails; the Service rolls back and maps known errors appropriately.','Unique violation වැනි errors classify කරයි. Failed flush පසු explicit rollback නොකර Session එක නැවත භාවිතා නොකරයි.','services/auth_service.py','Are all IntegrityErrors duplicate email errors?',18],
['What is a transaction?','It groups database changes into a unit that is committed or rolled back.','සාර්ථක වෙනස්කම් එකට තහවුරු කර අසාර්ථක වෙනස්කම් එකට අහෝසි කළ හැක.','database/session.py','Is a Session the same as a transaction?',9],
['What does rollback do?','It discards uncommitted changes in the current transaction.','කලින් commit වූ transaction එක undo නොකරයි. Failed Session state එකෙන් recovery සඳහාද අවශ්‍යය.','services/auth_service.py','Will an allocated sequence ID always be reused?',9],

['Authentication or authorization?','Authentication identifies the caller. Authorization checks their permission for an operation.','Token verify කිරීම අනන්‍යතාවයි; current.id == user_id rule එක අවසර තීරණය කිරීමයි.','routers/auth_router.py','When do we return 401 versus 403?',15],
['How does FastAPI validate a body?','It uses the annotated Pydantic schema to parse and validate request data before route execution.','Missing required field හෝ invalid value එකකට සාමාන්‍යයෙන් HTTP 422 response එකක් ලැබේ.','schemas/user.py','What does extra="forbid" do?',7],
['How does SQLAlchemy reach PostgreSQL?','An Engine uses a PostgreSQL driver to execute generated SQL over a database connection.','Session unit of work එක SQL සාදා Engine/driver එකෙන් database එකට යවයි.','database/session.py','How does Engine differ from Session?',6],

['PUT or PATCH?','PUT replaces the editable representation. PATCH applies selected changes.','PATCH සඳහා exclude_unset=True යොදා නොයැවූ fields අතහරියි. Explicit null වෙනම handle කළ යුතුය.','schemas/user.py','Does Optional mean a field has a default?',16],

['Do Python type hints validate at runtime?','Type hints alone do not enforce runtime validation in ordinary Python functions.','Pydantic සහ FastAPI annotations කියවා අමතර validation ක්‍රියාත්මක කරයි.','examples/python.py','What does strict=True change in Pydantic?',1],
['Why close a Session?','Closing releases its resources and rolls back any unfinished transaction.','Session එකට එක් request සීමාවක් දෙන්න; close කිරීම automatic commit කිරීමක් නොවේ.','database/session.py','Can one Session span multiple sequential transactions?',9]

 STEP('තෝරාගත් Python එක බලන්න',shell('python -c "import sys; print(sys.executable)"'),PROJECT_ROOT+' · .venv active','Environment එකේ Python executable path එකද කියා තහවුරු කරයි. Activated prompt text එකට වඩා මේ path එක සෘජු සාක්ෂියකි.','Example: …/student_api/.venv/bin/python\nWindows: …\\student_api\\.venv\\Scripts\\python.exe',[['-c','Quotes තුළ ඇති කුඩා Python statement එක run කරයි.'],['sys.executable','භාවිතා වන interpreter path එක.']],'Global Python path එකක් නම් environment එක activate කරන්න හෝ explicit .venv interpreter path භාවිතා කරන්න.'),
 STEP('Dependency file එකෙන් install කරන්න',shell('python -m pip install -r requirements.txt'),PROJECT_ROOT+' · .venv active','Curated file එකේ direct dependencies environment එකට install කරයි. File එක edit කළ පමණින් environment එක update නොවේ.','Example only: requirements satisfied / packages installed',[['-r','File එකෙන් requirements කියවයි.']],'Package name එක FastAPI source එකේ import syntax එක නොවේ. requirements.txt තුළ from fastapi import FastAPI නොලියන්න.'),
 STEP('Install වූ packages බලන්න',shell('python -m pip list'),PROJECT_ROOT+' · .venv active','දැනට install වූ packages සහ versions පෙන්වයි; file එක update කරන්නේ නැත.','Example only: fastapi, uvicorn සහ ඒවාට අවශ්‍ය transitive packages ලැයිස්තුගත වේ.\nසැබෑ version values ඔබේ environment එකට අදාළය.',[['list','Install වූ packages පෙන්වයි; ඒවා install හෝ uninstall නොකරයි.']],'ලැයිස්තුවට packages වැඩිපුර පෙනීම transitive dependencies නිසා විය හැක.'),
 STEP('එක් package එකක් පරීක්ෂා කරන්න',shell('python -m pip show fastapi'),PROJECT_ROOT+' · .venv active','Package name, installed version සහ location වැනි තොරතුරු බලයි.','Example only: Name: fastapi\nLocation: …/.venv/…/site-packages',[['show fastapi','fastapi package එකේ installed metadata පෙන්වයි.']],'Package not found නම් ඒ interpreter එකේ package එක install වී තිබේද බලන්න.'),
 STEP('Dependency compatibility බලන්න',shell('python -m pip check'),PROJECT_ROOT+' · .venv active','Declared package dependency conflicts හඳුනාගනියි. Endpoint එක නිවැරදිව run වේදැයි මේකෙන් පරීක්ෂා නොවේ.','Example only: No broken requirements found.\nඉන්පසු app එක සහ tests වෙනම පරීක්ෂා කරන්න.',[['check','Install වූ packages වල declared dependency compatibility බලයි.']],'Error එකක් නම් version constraints කියවා compatible versions තෝරන්න; අහඹුව සියල්ල upgrade නොකරන්න.'),
 STEP('Installed versions snapshot එක ලියන්න',shell('python -m pip freeze > requirements.lock.txt'),PROJECT_ROOT+' · පරීක්ෂා කළ clean .venv එක','Installed package versions වෙනම file එකක සටහන් කරයි. Curated requirements.txt එක overwrite කරන්නේ නැත. මේ නමේ .lock තිබුණත් pip freeze output එක සම්පූර්ණ cross-platform lockfile එකක් බවට පත් නොවේ.','Example only: requirements.lock.txt එක ඔබේ installed versions වලින් ලියවේ.\nමෙම simulation එක fake version list එකක් නිර්මාණය නොකරයි.',[['freeze','Installed packages requirements ආකෘතියෙන් ලැයිස්තුගත කරයි.'],['>','Output file එකකට ලියයි; දැනට ඇති ඒ file එක overwrite වේ.'],['requirements.lock.txt','මෙම course එකේ snapshot එකට භාවිතා කරන filename එක.']],'Global environment එක freeze කළොත් වෙනත් projects වල packages ද ඇතුළත් විය හැක. Clean project .venv එකෙන් කරන්න.'),
 STEP('Save වූ file එක කියවන්න',shell('cat requirements.lock.txt','Get-Content requirements.lock.txt','type requirements.lock.txt'),PROJECT_ROOT,'File එකේ version pins පරීක්ෂා කරන්න. package==version යනු exact version requirement එකකි; මෙම lab එකේ displayed versions නිර්මාණය කරන්නේ නැත.','Example only: ඔබේ snapshot file එකේ installed requirements පෙන්වයි.',[['cat / Get-Content / type','Text file එක කියවා terminal එකේ පෙන්වයි.'],['==','තනි නිශ්චිත package version එකක් ඉල්ලයි.']],'File not found නම් කලින් freeze output එක කුමන folder එකට ලියවුණාද බලන්න.'),
 STEP('Compatible clean environment එකක නැවත install කරන්න',shell('python -m pip install -r requirements.lock.txt'),'වෙනම compatible clean .venv එකක් සකසා activate කළ පසු project root එකේ','වෙනත් environment එකක් නැවත සකස් කිරීමේ command එකයි. මේ steps run කරන environment එකේ Python version/platform එකත් සැලකිය යුතුය. ඉන්පසු pip check සහ project tests කරන්න.','Example only: snapshot requirements වලින් install කරයි.\nSame pins තිබුණත් platform සහ system dependencies වෙනස් විය හැක.',[['-r requirements.lock.txt','Curated file එක වෙනුවට tested snapshot එක කියවයි.']],'Package version එක ඔබේ Python version එකට compatible ද බලන්න. සම්පූර්ණ reproduction එකට Python/system dependencies ද සටහන් කරන්න.')
 ]},
 docker:{title:'Optional Docker · local learning project',steps:[
 STEP('Docker CLI එක බලන්න',shell('docker --version'),'Docker install කර තිබෙන වෙනම learning computer එකක terminal එකේ','මෙය optional branch එකකි. Docker නැතිව course එක සහ Python local app එක ඉගෙන ගත හැක.','Example only: Docker CLI version එක පෙන්වයි.',[['docker','Container tooling CLI එක.'],['--version','Client version එක බලයි.']],'Command not found නම් official Docker install guide එකෙන් OS එකට ගැළපෙන setup එක බලන්න.'),
 STEP('Docker daemon එකට සම්බන්ධ විය හැකිද බලන්න',shell('docker info'),'Docker Desktop / Docker Engine සක්‍රිය කර ඇති terminal එකේ','CLI එක තිබීමෙන් daemon එක run වන බව තහවුරු නොවේ. info මඟින් client-server connectivity සහ runtime තොරතුරු බලයි.','Example only: Docker server reachable.',[['info','Docker Engine runtime තොරතුරු ඉල්ලයි.']],'Cannot connect to Docker daemon නම් Desktop/Engine startup සහ ඔබේ OS permissions බලන්න; version check එක පමණක් ප්‍රමාණවත් නැත.'),
 STEP('Compose plugin එක බලන්න',shell('docker compose version'),'Docker-enabled terminal එකේ','Compose V2 plugin command එක docker compose ය; මෙහි legacy docker-compose command එක භාවිතා නොකරයි.','Example only: Docker Compose plugin version එක පෙන්වයි.',[['compose version','Compose plugin එක තිබේදැයි පරීක්ෂා කරයි.']],'compose command එක හමු නොවේ නම් official Compose plugin installation එක පරීක්ෂා කරන්න.'),
 STEP('Dockerfile එක Save කරන්න',null,PROJECT_ROOT+' · starter main.py සහ requirements.txt Save කර තිබිය යුතුය','Project root එකේ Dockerfile නමෙන් extension එකක් නැති file එකක් සාදා පහත example එක Save කරන්න.','Example only: Dockerfile එක Save කළා.',[['FROM / WORKDIR','Runtime base සහ container working folder එක.'],['RUN / CMD','Build-time command එක හා container startup command එක වෙනස්ය.']],'Dockerfile.txt ලෙස file extension එක අමතරව යෙදී නැතිද බලන්න.','starter/Dockerfile'),
 STEP('.dockerignore එක Save කරන්න',null,PROJECT_ROOT,'Host .venv සහ local secrets image build context එකට නොයවන්න. .gitignore සහ .dockerignore එකම tool එකට අදාළ files නොවේ.','Example only: .dockerignore එක Save කළා.',[['.dockerignore','Image build context එකෙන් paths ඉවත් කරන file එක.']],'COPY . . කරන projects වල .env secrets image layers තුළට ගමන් නොකරන බව විශේෂයෙන් බලන්න.','starter/.dockerignore'),
 STEP('Image එක build කරන්න',shell('docker build -t student-api-demo .'),PROJECT_ROOT+' · Dockerfile තිබෙන තැන','Dockerfile instructions යොදා image එක සාදයි. මුල්වර internet මඟින් base image සහ packages download විය හැක.','Example only: image student-api-demo build සාර්ථකයි.\nසැබෑ build එකක් browser එකේ ක්‍රියාත්මක නොවීය.',[['build','Image එක සාදයි.'],['-t student-api-demo','Image එකට නමක්/tag එකක් දෙයි.'],['.','Current folder එක build context එකයි; මෙය අමතක නොකරන්න.']],'requirements.txt හෝ main.py COPY fail නම් build context folder එකේ ඒ files තිබේද සහ Save කළාද බලන්න.'),
 STEP('Container එක run කරන්න',shell('docker run --rm --name student-api-demo -p 127.0.0.1:8000:8000 student-api-demo'),PROJECT_ROOT+' · foreground terminal එක','Image එකෙන් container එක run කර local host port එක publish කරයි. මේ terminal එකේ process එක run වෙමින් පවතී.','Example only: http://127.0.0.1:8000/ → {"message":"Welcome"}',[['--rm','Container එක stop වූ පසු එය remove කරයි; image එක නොවේ.'],['--name','Container එකට logs/stop සඳහා නමක් දෙයි.'],['-p 127.0.0.1:8000:8000','Local host port 8000 → container port 8000.']],'Port 8000 busy නම් කලින් Uvicorn process එක නවතා හෝ host mapping එක 127.0.0.1:8001:8000 ලෙස වෙනස් කරන්න.'),
 STEP('Container logs බලන්න',shell('docker logs student-api-demo'),'වෙනත් terminal එකක · foreground container එක තවම run වෙයි','Server startup සහ errors බලන්න. මේ command එක container එක තුළ shell එකක් විවෘත කරන්නේ නැත.','Example only: startup complete; request log lines.',[['logs','නම් කළ container එකේ captured logs පෙන්වයි.']],'No such container නම් docker ps මඟින් container නම සහ run තත්ත්වය බලන්න.'),

let setupOS=/Win/.test(navigator.platform)?'powershell':'unix',setupScenario='project';
const setupSessions=new Map();
function setupSession(key){const id=key+':'+setupOS;if(!setupSessions.has(id))setupSessions.set(id,{selected:0,done:new Set(),lastOutput:'Command එක තෝරා “Simulate” ඔබන්න. ඔබේ computer එකේ කිසිදු command එකක් execute නොවේ.'});return setupSessions.get(id);}
function setupWidget(key='project'){const guide=SETUP_GUIDES[key];return`<section class="setup-lab" data-setup="${key}"><div class="row between"><h3 style="margin:0">Guided terminal practice</h3><span class="pill purple">NO COMMANDS ARE EXECUTED</span></div><p class="small muted">Command එක, එහි කොටස්, run කරන folder එක සහ output එක එකට ඉගෙන ගන්න. පියවර අනුපිළිවෙළට simulate කරන්න.</p><div class="form-grid"><label class="field">ඔබේ OS / Shell<select data-setup-os>${SETUP_OS.map(([v,t])=>`<option value="${v}" ${v===setupOS?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">Practice path<select data-setup-path>${Object.entries(SETUP_GUIDES).map(([k,g])=>`<option value="${k}" ${k===key?'selected':''}>${g.title}</option>`).join('')}</select></label></div><div class="setup-grid section-space"><nav class="setup-steps" aria-label="Setup command steps">${guide.steps.map((s,i)=>`<button data-setup-step="${i}"><span>${i+1}</span>${esc(s.name)}</button>`).join('')}</nav><div class="setup-detail" data-setup-detail aria-live="polite"></div></div><div class="controls section-space"><button class="btn tiny" data-setup-action="prev">← Previous step</button><button class="btn tiny primary" data-setup-action="run">▷ Simulate this step</button><button class="btn tiny" data-setup-action="next">Next step →</button><button class="btn tiny ghost" data-setup-action="reset">Reset this demo</button><span class="step-counter" data-setup-count></span></div><pre class="output setup-output" data-setup-output aria-live="polite"></pre>${simNote()}</section>`;}
function paintSetup(root){const key=root.dataset.setup,g=SETUP_GUIDES[key],session=setupSession(key),i=session.selected,s=g.steps[i],command=s.command?.[setupOS];$$('[data-setup-step]',root).forEach((b,j)=>{b.classList.toggle('active',j===i);b.classList.toggle('passed',session.done.has(j));b.setAttribute('aria-current',j===i?'step':'false');$('span',b).textContent=session.done.has(j)?'✓':j+1;});const file=s.file?FILES[s.file]:null;$('[data-setup-detail]',root).innerHTML=`<span class="eyebrow">STEP ${i+1} · ${s.file?'EDITOR FILE':'TERMINAL / WORKFLOW'}</span><h3 style="margin:10px 0">${esc(s.name)}</h3><div class="note"><strong>කොතැනින්ද?</strong> ${esc(s.where)}</div><p style="margin-top:15px">${esc(s.why)}</p>${command?`<div class="terminal-command"><span class="eyebrow">${esc(SETUP_OS.find(x=>x[0]===setupOS)[1])} · ${command==='Ctrl+C'?'KEYBOARD SHORTCUT':'PROMPT එක COPY නොකරන්න'}</span><pre>${esc(command)}</pre><button class="btn tiny" data-setup-copy>Copy ${command==='Ctrl+C'?'shortcut text':'command'}</button></div>`:file?`<div class="code-panel"><div class="code-toolbar">${esc(s.file.replace('starter/',''))} · SAVE IN PROJECT ROOT</div><pre class="setup-file">${esc(file.lines.join('\n'))}</pre></div><button class="text-btn" data-open-file="${s.file}">පේළියෙන් පේළිය පැහැදිලි කිරීම →</button>`:`<div class="keybox">Browser / editor පියවරකි. Terminal එකේ URL එකක් හෝ Sinhala උපදෙස් command එකක් ලෙස type කරන්න එපා.</div>`}<dl class="command-parts">${s.parts.map(([t,d])=>`<dt>${esc(t)}</dt><dd>${esc(d)}</dd>`).join('')}</dl><details class="setup-trouble"><summary>වැරදුණොත් බලන්න · Common error & fix</summary><p>${esc(s.problem)}</p></details>${s.file==='starter/compose.yaml'?'<div class="note section-space">Minimal starter main.py එකට Database imports නැත. Compose db service එක සූදානම් කළ පමණින් GET / එක database operation එකක් නොවේ. Full layered example එකට අවශ්‍ය extra requirements, DATABASE_URL, JWT_SECRET_KEY සහ schema/migration setup පසුව වෙනම එක් කළ යුතුය.</div>':''}`;$('[data-setup-action=prev]',root).disabled=i===0;$('[data-setup-action=next]',root).disabled=i===g.steps.length-1;$('[data-setup-count]',root).textContent=`${session.done.size} / ${g.steps.length} steps explored`;output($('[data-setup-output]',root),session.lastOutput);}
function setupAction(root,action){const key=root.dataset.setup,g=SETUP_GUIDES[key],s=setupSession(key);if(action==='reset'){setupSessions.delete(key+':'+setupOS);paintSetup(root);return;}if(action==='prev'||action==='next'){s.selected=Math.max(0,Math.min(g.steps.length-1,s.selected+(action==='next'?1:-1)));paintSetup(root);return;}const missing=g.steps.findIndex((_,i)=>i<s.selected&&!s.done.has(i));if(missing>=0){s.lastOutput=`පළමුව step ${missing+1}: ${g.steps[missing].name} simulate කරන්න.\nමේ sequence එකේ prerequisites මුලින් සූදානම් විය යුතුය.`;paintSetup(root);return;}s.done.add(s.selected);const step=g.steps[s.selected];s.lastOutput=`SIMULATED OUTPUT · STEP ${s.selected+1}\n${step.command?.[setupOS]||'Editor / browser action · shell command එකක් නොවේ.'}\n\n${step.expected}\n\n${s.done.size===g.steps.length?'✓ මේ practice path එක අවසන්. Related lesson knowledge check එකද කරන්න.':'Next ඔබා ඊළඟ පියවර බලන්න.'}`;paintSetup(root);}
async function copySetupCommand(root){const s=SETUP_GUIDES[root.dataset.setup].steps[setupSession(root.dataset.setup).selected],command=s.command?.[setupOS];if(!command)return;try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(command);else{const t=document.createElement('textarea');t.value=command;t.style.cssText='position:fixed;left:-9999px';document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('copy');}toast('Command text copied. ඔබේ shell එක සහ current folder එක බලන්න.');}catch{toast('Clipboard නොලැබේ. Command text එක select කර copy කරන්න.');}}

try{const raw=localStorage.getItem(STORE_KEY);if(raw){const s=JSON.parse(raw);if(!s||s.version!==1||!Array.isArray(s.completed))throw Error('format');state={...fresh(),theme:['light','dark'].includes(s.theme)?s.theme:'light',last:Number.isInteger(s.last)&&LESSONS[s.last]?s.last:44,completed:[...new Set(s.completed.filter(x=>Number.isInteger(x)&&LESSONS[x]))],exercises:{},daily:{}};if(s.exercises&&typeof s.exercises==='object')for(const [k,v] of Object.entries(s.exercises))if(/^(lesson-\d+|lab-\d+|debug-\d+)$/.test(k)&&v&&typeof v.passed==='boolean')state.exercises[k]={passed:v.passed,attempts:Math.max(0,Math.min(10000,Number(v.attempts)||0)),correct:Math.max(0,Math.min(Number(v.attempts)||0,Number(v.correct)||(v.passed?1:0)))};if(s.daily&&typeof s.daily==='object')for(const [k,v] of Object.entries(s.daily))if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&Array.isArray(v))state.daily[k]=[...new Set(v.filter(x=>Number.isInteger(x)&&LESSONS[x]))];}}catch(e){storageIssue='Saved progress කියවීමට නොහැකි විය. මෙම session එක සඳහා අලුතින් ආරම්භ කර ඇත.';}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){storageIssue='Browser storage නොලැබෙන නිසා progress මෙම session එක තුළ පමණක් පවතී.';showStorage();}}
function showStorage(){const el=$('#storage-status');el.textContent=storageIssue;el.classList.toggle('visible',!!storageIssue);}
function todayKey(){return new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Asia/Colombo'}).format(new Date());}
const stats=()=>{const completed=CORE_LESSONS.filter(l=>state.completed.includes(l.id)).length,passed=Object.values(state.exercises).filter(x=>x.passed).length,attempted=Object.keys(state.exercises).length;const attempts=Object.values(state.exercises).reduce((n,x)=>n+x.attempts,0),correct=Object.values(state.exercises).reduce((n,x)=>n+(x.correct||0),0);return{completed,passed,attempted,totalLessons:CORE_LESSONS.length,totalModules:CORE_MODULES.length,optionalCompleted:MODULES[24].lessons.filter(l=>state.completed.includes(l.id)).length,accuracy:attempts?Math.round(correct/attempts*100):null,percent:Math.round(completed/CORE_LESSONS.length*100),modules:CORE_MODULES.filter(m=>m.lessons.every(l=>state.completed.includes(l.id))).length,today:(state.daily[todayKey()]||[]).length};};
let toastTimer;function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3600);}

function syncSidebarA11y(){$('#sidebar').inert=innerWidth<=800&&!$('#sidebar').classList.contains('visible');}function closeMenu(){const returnFocus=innerWidth<=800&&$('#sidebar').contains(document.activeElement);$('#sidebar').classList.remove('visible');$('#scrim').classList.remove('visible');$('#menu-toggle').setAttribute('aria-expanded','false');syncSidebarA11y();if(returnFocus)$('#menu-toggle').focus();}

let lessonStepObserver;
function observeLessonSteps() {
  lessonStepObserver?.disconnect();
  if(page!=='learn'||!('IntersectionObserver' in window)) return;
  lessonStepObserver=new IntersectionObserver(entries=>{
    const visible=entries.filter(entry=>entry.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);
    if(!visible.length)return;
    const id=visible[0].target.closest('.lesson-section').id.replace('lesson-','');
    $$('[data-lesson-section]').forEach(button=>{if(button.dataset.lessonSection===id)button.setAttribute('aria-current','step');else button.removeAttribute('aria-current');});
  },{rootMargin:'-75px 0px -55% 0px',threshold:0});
  $$('.lesson-section > .section-heading').forEach(heading=>lessonStepObserver.observe(heading));
}

ount recovery, revocation, rate limiting සහ deployment configuration මෙහි sample files වල ඇතුළත් නැත. requirements list එක dependency names පෙන්වයි; production lockfile එකක් නොවේ.</p></div></div>`;}
function fileOverview(f){const classes=f.lines.filter(l=>/^class /.test(l)),funcs=f.lines.filter(l=>/^\s*def /.test(l));return`<p><strong>වගකීම:</strong> ${esc(f.purpose)}</p><p><strong>Classes:</strong> ${esc(classes.join(' · ')||'—')}</p><p><strong>Functions / parameters / return hints:</strong></p><pre style="white-space:pre-wrap;font-size:10px">${esc(funcs.join('\n')||'—')}</pre><p><strong>Caller:</strong> ${esc(f.caller)}</p><p><strong>Input / Output:</strong> ${esc(f.signature)}</p>`;}
function explorerAction(action){const f=FILES[currentFile],panel=$('[data-code-file]');if(action==='prev'||action==='next'){selectLine(panel,Math.max(0,Math.min(f.lines.length-1,selectedExplorerLine+(action==='next'?1:-1))));return;}const out=$('#file-inspector');if(action==='reset'){selectedExplorerLine=0;selectLine(panel,0);$$('.related',panel).forEach(b=>b.classList.remove('related'));out.innerHTML=fileOverview(f);$('#explorer-flow').innerHTML='';return;}if(action==='related'){const tokens=f.lines[selectedExplorerLine].match(/\b(?:user|payload|repo|db|User|Session|service)\b/g)||[f.lines[selectedExplorerLine].trim().split(/[\s.(]/)[0]];$$('[data-line]',panel).forEach(b=>b.classList.toggle('related',tokens.some(t=>t&&f.lines[Number(b.dataset.line)].includes(t))));out.innerHTML=`<p><strong>Related symbols:</strong> ${esc(tokens.join(', '))}</p><p>එකම symbol එක භාවිතා කරන පේළි highlight කර ඇත. මෙය text-based reference aid එකකි; Python static analysis නොවේ.</p>`;return;}if(action==='deps'){const imports=f.lines.filter(l=>/^(from|import) /.test(l));out.innerHTML='<p><strong>Imports / dependencies</strong></p>'+(imports.length?imports.map(l=>{const name=l.match(/^from ([\w.]+)/)?.[1],target=name?.replaceAll('.','/')+'.py';return`<p><code>${esc(l)}</code> ${FILES[target]?`<button class="text-btn" data-open-file="${target}">Open →</button>`:''}</p>`}).join(''):'<p>මෙම ගොනුවේ imports නැත.</p>');return;}if(action==='caller'){out.innerHTML=`<p><strong>මෙය call කරන / import කරන තැන්:</strong> ${esc(f.caller)}</p>`+Object.values(FILES).filter(x=>x.name!==f.name&&x.lines.some(l=>l.includes(f.name.replace(/\.py$/,'').replaceAll('/','.')))).map(x=>`<button class="btn tiny" data-open-file="${x.name}">${esc(x.name)} →</button>`).join('');return;}if(action==='function'){let i=selectedExplorerLine;while(i>0&&!/^\s*(def |class )/.test(f.lines[i]))i--;const text=f.lines[i];out.innerHTML=`<p><strong>${esc(text||f.signature)}</strong></p><p>${esc(f.notes[i])}</p><p>Input/output contract function renderFlowPage(){return pageHead('ARCHITECTURE EXPLORER','Layer එකෙන් layer එකට','එකම teaching architecture එක තුළ වෙනස් operations යන මාර්ග තෝරන්න. Node එක තෝරා input, output, type, source සහ next call එක පරීක්ෂා කරන්න.')+`<div class="row" style="margin:20px 0"><label class="field">Workflow<select id="workflow-select">${[['registration','Registration'],['login','Login'],['get','Get user'],['update','Update user'],['delete','Delete user'],['jwt','Protected endpoint']].map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select></label><span class="small muted">Architecture එක project එක අනුව වෙනස් විය හැක; මෙහි Service එක transaction owner ය.</span></div><div id="workflow-view">${flowWidget('registration')}</div><section class="card section-space"><h3>Layer එක අයින් කළොත්?</h3><div class="table-wrap"><table><thead><tr><th>Layer</th><th>එය අවශ්‍ය ඇයි?</th><th>අයින් කළොත් ඇතිවන ගැටලුව</th></tr></thead><tbody>${[['Client','ඉල්ලීම සකස් කිරීමට','User interaction හෝ වෙනත් request source එකක් අවශ්‍ය වේ.'],['Router','HTTP boundary එක පාලනයට','Paths සහ HTTP mapping වෙනත් ස්ථානයක කරන්න සිදුවේ.'],['Pydantic Schema','Request shape සහ output contract සඳහා','Manual validation සහ serialization අවශ්‍ය වේ.'],['Service','Business rules හා transactions එකතු කිරීමට','Rules Router/Repository තුළ පැතිරී testing අපහසු වේ.'],['Repository','Queries සඟවා නැවත භාවිතයට','Service එක query details වලට තදින් බැඳේ.'],['SQLAlchemy ORM','Object mapping හා unit of work සඳහා','Raw SQL හා object hydration අතින් පාලනය කළ යුතුය; ORM අනිවාර්ය library එකක් නොවේ.'],['PostgreSQL','Durable relational storage සඳහා','Durable store එකක් හෝ වෙනත් persistence implementation එකක් අවශ්‍ය වේ.'],['Response Schema','Public fields පමණක් expose කිරීමට','Manual output filtering නිවැරදිව නොකළොත් secrets leak විය හැක.'],['HTTP Response','Client එකට ප්‍රතිඵලය ලබාදීමට','Client එකට status හෝ output නොලැබේ.']].map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></sectio function databaseWidget(){return`<div data-db-widget><div class="row between"><h3 style="margin:0">Database playground</h3><span class="pill blue">BROWSER MEMORY · users</span></div><p class="small muted" style="margin:10px 0 16px">rows වෙනස් කර ඒකට අදාළ SQL එක බලන්න. Hash values මෙහි සංකේතාත්මක labels පමණි. Password එකක් ගබඩා නොකරයි.</p><form data-db-form><div class="form-grid"><label class="field">Full name<input name="full_name" minlength="2" maxlength="120" placeholder="Amal Perera" required></label><label class="field">Email<input name="email" type="email" maxlength="255" placeholder="amal@example.com" required></label><label class="field">is_active<select name="is_active"><option value="true">True · ක්‍රියාකාරී</option><option value="false">False · අක්‍රිය</option></select></label><div class="row" style="align-self:end"><button class="btn primary" type="submit" data-db-save>Add row</button><button class="btn ghost" type="button" data-db-action="cancel">Clear</button></div></div></form><div class="row between" style="margin:20px 0 12px"><label class="field" style="flex:1;min-width:160px">Search rows<input data-db-search type="search" placeholder="Name / email…"></label><label class="field">Filter<select data-db-filter><option value="all">All rows</option><option value="true">Active</option><option value="false">Inactive</option></select></label><button class="btn tiny" data-db-action="view">SELECT all</button><button class="btn tiny ghost" data-db-action="reset">Reset sample data</button></div><div data-db-table></div><pre class="output" data-db-output aria-live="polite">SELECT * FROM users ORDER BY id;</pre>${simNote()}</div>`;}
function paintDb(root){const q=$('[data-db-search]',root).value.trim().toLowerCase(),filter=$('[data-db-filter]',root).value;const rows=dbRows.filter(r=>(r.full_name+' '+r.email).toLowerCase().includes(q)&&(filter==='all'||String(r.is_active)===filter));$('[data-db-table]',root).innerHTML=`<div class="table-wrap"><table><thead><tr><th>id · PK</th><th>full_name</th><th>email · UNIQUE</th><th>is_active</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr><td><code>${r.id}</code></td><td>${esc(r.full_name)}</td><td>${esc(r.email)}</td><td>${r.is_active?'True':'False'}</td><td><div class="row"><button class="btn tiny" data-db-edit="${r.id}">Edit</button><button class="btn tiny danger" data-db-delete="${r.id}">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">ගැළපෙන rows නැත. Filter වෙනස් කරන්න හෝ sample data reset කරන්න.</td></tr>'}</tbody></table></div><p class="small muted" style="margin-top:8px">${rows.length} shown / ${dbRows.length} rows · hashed_password සහ created_at columns Model explorer එකෙන් බලන්න.</p>`;}

function dbSubmit(form){const root=form.closest('[data-db-widget]'),out=$('[data-db-output]',root),name=form.elements.full_name.value.trim(),email=form.elements.email.value.trim();if(name.length<2||name.length>120||!simpleEmail(email)){output(out,'422 · නම හෝ email වලංගු නැත.',true);return;}if(dbRows.some(r=>r.email===email&&r.id!==dbEditing)){output(out,'IntegrityError · UNIQUE(email)\nROLLBACK;\nDatabase state වෙනස් නොවීය.',true);return;}const active=form.elements.is_active.value==='true';if(dbEditing!==null){const r=dbRows.find(r=>r.id===dbEditing);if(!r){output(out,'404 · Row එක නැත.',true);return;}Object.assign(r,{full_name:name,email,is_active:active});output(out,'UPDATE users SET full_name = :name, email = :email, is_active = :active\nWHERE id = :id;\nCOMMIT;\nparams = '+JSON.stringify({name,email,active,id:r.id},null,2));}else{const r={id:dbNext++,full_name:name,email,is_active:active,hashed_password:'[Argon2id hash · conceptual]',created_at:new Date().toISOString()};dbRows.push(r);output(out,'INSERT INTO users (full_name, email, hashed_password, is_active)\nVALUES (:name, :email, :hash, :active) RETURNING id;\nCOMMIT;\nparams = '+JSON.stringify({name,email,hash:'[educational placeholder, not a real hash]',active},null,2)+'\nGenerated ID: '+r.id);}dbEditing=null;form.reset();$('[data-db-save]',form).textContent='Add row';syncDb();}

function transactionWidget(){return`<div data-tx-widget><div class="row between"><h3 style="margin:0">Transaction workspace</h3><span class="pill purple">CONCEPTUAL SESSION</span></div><p class="small muted" style="margin:10px 0">Create → Add → Flush → Commit sequence එක කර බලන්න. වෙනත් මාර්ගයක error එකක් ඇති කර Rollback කරන්න. Committed row එකක් rollback කිරීමෙන් ඉවත් නොවේ.</p><label class="field">New user email<input data-tx-email type="email" value="amal@example.com"></label><div class="state-grid"><div class="state-box"><h4>PYTHON MEMORY</h4><p data-tx-memory></p></div><div class="state-box"><h4>CURRENT TRANSACTION</h4><p data-tx-working></p></div><div class="state-box"><h4>COMMITTED DATABASE</h4><p data-tx-committed></p></div></div><div class="controls"><button class="btn tiny" data-tx="create">1 · Create object</button><button class="btn tiny" data-tx="add">2 · Add</button><button class="btn tiny" data-tx="flush">3 · Flush</button><button class="btn tiny primary" data-tx="commit">4 · Commit</button><button class="btn tiny danger" data-tx="error">Trigger error</button><button class="btn tiny" data-tx="rollback">Rollback</button><button class="btn tiny ghost" data-tx="reset">Reset</button></div><pre class="output" data-tx-log aria-live="polite"></pre>${simNote()}<p class="small muted">SQLAlchemy configuration, autoflush සහ database isolation මත සැබෑ හැසිරීම වෙනස් විය හැක. Trigger error button එක UNIQUE violation එකක් සංකල්පීයව පෙන්වයි. PostgreSQL sequence IDs rollback එකෙන් අනිවාර්යයෙන් නැවත භාවිතා නොවේ.</p></div>`;}
function paintTx(root){$('[data-tx-memory]',root).textContent=tx.object?JSON.stringify(tx.object,null,2)+'\nstate: '+tx.phase:'No ORM object';$('[data-tx-working]',root).textContent=tx.failed?'FAILED · rollback required':tx.working.length?JSON.stringify(tx.working,null,2)+'\nUNCOMMITTED':tx.phase==='pending'?'Pending in Session · SQL not flushed':'No uncommitted rows';$('[data-tx-committed]',root).textContent=JSON.stringify(tx.committed,null,2);output($('[data-tx-log]',root),tx.log,tx.failed);const disable={create:!['empty','committed','rolledback'].includes(tx.phase),add:tx.phase!=='transient',flush:tx.phase!=='pending',commit:!['pending','flushed'].includes(tx.phase),error:!['pending','flushed'].includes(tx.phase),rollback:!['pending','flushed','failed'].includes(tx.phase)};for(const[k,v]of Object.entries(disable))$(`[data-tx=${k}]`,root).disabled=v;}
function txAction(root,action){if(action==='reset'){tx=txFresh();}else if(action==='create'){const email=$('[data-tx-email]',root).value.trim();if(!simpleEmail(email)){toast('වලංගු email එකක් ඇතුළත් කරන්න.');return;}tx.object={email};tx.phase='transient';tx.log='user = User(email=...)\nMemory object එකක් පමණි. Database එකට SQL යවා නැත.';}else if(action==='add'){tx.phase='pending';tx.log='db.add(user)\nObject එක Session එකේ pending state එකේ ඇත.';}else if(action==='flush'||action==='commit'){if(tx.failed)return;const duplicate=tx.committed.some(r=>r.email===tx.object.email);if(duplicate){tx.failed=true;tx.phase='failed';tx.working=[];tx.log='INSERT ...;\nIntegrityError: UNIQUE(email)\nTransaction failed. db.rollback() අවශ්‍යය.';}else{if(tx.phase==='pending'){tx.object.id=tx.next++;tx.working=[{...tx.object}];}if(action==='flush'){tx.phase='flushed';tx.log='db.flush() → INSERT ... RETURNING id\nID ලැබුණත් row එක UNCOMMITTED ය. Rollback කළ හැක.';}else{tx.committed.push(...tx.working);tx.working=[];tx.phase='committed';tx.log='db.commit() → COMMIT;\nTransaction තහවුරු විය. Pending object එකක් තිබුණා නම් commit මඟින් flush ද සිදු විය.\nපසුව rollback කිරීමෙන් මේ committed row එක ඉවත් නොවේ.';}}}else if(action==='error'){tx.failed=true;tx.phase='failed';tx.working=[];tx.log='Simulated flush error: UNIQUE constraint violation\nDatabase transaction අසාර්ථකයි. Session එක recovery සඳහා rollback බලා සිටී.';}else if(action==='rollback'){tx.working=[];tx.object=null;tx.failed=false;tx.phase='rolledback';tx.log='db.rollback() → ROLLBACK;\nUncommitted changes ඉවත් විය. කලින් committed rows තවම පවතී.\nSession එකෙන් නව transaction එකක් ආරම්භ කළ හැක.';}$$('[data-tx-widget]').forEach(paintTx);}
const simpleEmail=s=>typeof s==='string'&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
function validateSample(data){if(!data||typeof data!=='object'||Array.isArray(data))return[{loc:['body'],msg:'JSON object එකක් අවශ්‍යය.',type:'model_type'}];const errors=[];for(const key of['full_name','email','password']){if(!(key in data)){errors.push({loc:['body',key],msg:'අනිවාර්ය field එක නොමැත.',type:'missing'});continue;}if(typeof data[key]!=='string'){errors.push({loc:['body',key],msg:'String value එකක් අවශ්‍යය.',type:'string_type'});continue;}if(key==='email'&&!simpleEmail(data[key]))errors.push({loc:['body',key],msg:'Email ආකෘතිය වලංගු නැත.',type:'value_error'});if(key==='full_name'&&(data[key].length<2||data[key].length>120))errors.push({loc:['body',key],msg:'නම අකුරු 2–120 අතර විය යුතුය.',type:'string_length'});if(key==='password'&&(data[key].length<12||data[key].length>128))errors.push({loc:['body',key],msg:'Password අකුරු 12–128 අතර විය යුතුය.',type:'string_length'});}for(const key of Object.keys(data))if(!['full_name','email','password'].includes(key))errors.push({loc:['body',key],msg:'extra="forbid" නිසා මෙම field එක අනුමත නැත.',type:'extra_forbidden'});return errors;}
const sampleInput=()=>JSON.stringify({full_name:'Kamal Perera',email:'kamal@example.com',password:'ExamplePassword123!'},null,2);
function validationWidget(){return`<div data-validator><h3>Schema validation lab</h3><p class="small muted">UserCreate contract එකට JSON එක ගළපන්න. Extra fields මෙහි forbid කර ඇත. මෙය strict string fields සඳහා සරල checker එකකි; සැබෑ Pydantic EmailStr parser එක නොවේ.</p><div class="row" style="margin-bottom:12px"><label class="field">Example<select data-validation-preset><option value="valid">Valid input</option><option value="missing">Missing email</option><option value="email">Invalid email</option><option value="type">Wrong type</option><option value="extra">Unexpected field</option></select></label></div><label class="field">Request JSON<textarea data-validation-input rows="7" spellcheck="false">${esc(sampleInput())}</textarea></label><button class="btn primary" style="margin-top:13px" data-validate>Validate JSON →</button><pre class="output" data-validation-output aria-live="polite">Example එක වෙනස් කර validate කරන්න. Input passwords persist කරන්නේ නැත.</pre>${simNote()}</div>`;}
function httpWidget(){return`<div data-http><h3>Request playground</h3><p class="small muted">HTTP method, path සහ JSON body වෙනස් කර response එක බලන්න. මෙම කෙටි lab එකේ authentication සහ authorization සාර්ථක වී ඇතැයි උපකල්පනය කරයි; සම්පූර්ණ security flow එක Login lab එකේ ඇත.</p><div class="form-grid"><label class="field">HTTP method<select data-http-method>${['GET','POST','PUT','PATCH','DELETE'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field">Endpoint path<input data-http-path value="/users/1" list="endpoint-paths"></label></div><datalist id="endpoint-paths"><option value="/"><option value="/users"><option value="/users/1"><option value="/auth/register"></datalist><label class="field" style="margin-top:12px">JSON body · GET/DELETE සඳහා නොසලකා හරියි<textarea data-http-body rows="5" spellcheck="false">${esc(sampleInput())}</textarea></label><button class="btn primary" data-http-send style="margin-top:12px">Send simulated request →</button><pre class="output" data-http-output aria-live="polite">GET /users/1\nSend ඔබා simulated response එක බලන්න.</pre>${simNote()}</div>`;}
function httpSend(root){const method=$('[data-http-method]',root).value,path=$('[data-http-path]',root).value.trim().split('?')[0],out=$('[data-http-output]',root);let body={},status=200,result,sql='';try{if(['POST','PUT','PATCH'].includes(method))body=JSON.parse($('[data-http-body]',root).value);}catch{output(out,'400 Bad Request · JSON parse කිරීමට නොහැක.',true);return;}const match=path.match(/^\/users\/(\d+)$/),id=match?Number(match[1]):null,row=dbRows.find(r=>r.id===id);if(method==='GET'&&path==='/')result={message:'Welcome'};else if(method==='GET'&&path==='/users'){result=dbRows.map(publicRow);sql='SELECT * FROM users ORDER BY id; (conceptual authorized directory)';}else if(path==='/auth/register'&&method==='POST'){const errors=validateSample(body);if(errors.length){status=422;result={detail:errors};}else if(dbRows.some(r=>r.email===body.email)){status=409;result={detail:'Email already registered'};}else{const r={id:dbNext++,full_name:body.full_name,email:body.email,hashed_password:'[conceptual hash · no real hashing]',is_active:true,created_at:new Date().toISOString()};dbRows.push(r);status=201;result=publicRow(r);sql='add → flush → INSERT → commit → UserRead';}}else if(match){if(!row){status=404;result={detail:'User not found'};}else if(method==='GET'){result=publicRow(row);sql='SELECT ... WHERE id = :id';}else if(method==='DELETE'){dbRows=dbRows.filter(r=>r.id!==id);status=204;sql='DELETE ... WHERE id = :id; COMMIT;';}else if(['PUT','PATCH'].includes(method)){const validBody=body&&typeof body==='object'&&!Array.isArray(body),errors=[];if(!validBody)errors.push('JSON object එකක් අවශ්‍යය.');else{if(method==='PUT'&&(!('full_name'in body)||!('is_active'in body)))errors.push('PUT requires full_name and is_active');if('full_name'in body&&(typeof body.full_name!=='string'||body.full_name.length<2||body.full_name.length>120))errors.push('Invalid full_name');if('is_active'in body&&typeof body.is_active!=='boolean')errors.push('is_active must be boolean');if(Object.keys(body).some(k=>!['full_name','is_active'].includes(k)))errors.push('Only full_name/is_active are editable in this lab');}if(errors.length){status=422;result={detail:errors};}else{if('full_name'in body)row.full_name=body.full_name;if('is_active'in body)row.is_active=body.is_active;result=publicRow(row);sql='UPDATE ... WHERE id = :id; COMMIT;';}}else{status=405;result={detail:'Method not allowed'};}}else if(['/','/users','/auth/register'].includes(path)){status=405;result={detail:'Method not allowed'};}else if(/^\/users\/[^/]+$/.test(path)){status=422;result={detail:'user_id must be an integer'};}else{status=404;result={detail:'Endpoint not found'};}const names={200:'OK',201:'Created',204:'No Content',400:'Bad Request',404:'Not Found',405:'Method Not Allowed',409:'Conflict',422:'Unprocessable Content'};output(out,`${method} ${path}\nHTTP ${status} ${names[status]||''}\n${status===204?'(empty response body)':JSON.stringify(result,null,2)}${sql?'\n\nConceptual operation: '+sql:''}`,status>=400);syncDb();}

function loginWidget(){return`<div data-login><h3>Login & protected endpoint lab</h3><p class="small muted">Sample account: <code>kamal@example.com</code> / <code>ExamplePassword123!</code>. සැබෑ password එකක් ඇතුළත් නොකරන්න. Credentials සහ token එක localStorage වෙත නොයවයි.</p><div class="form-grid"><label class="field">Sample email<input data-login-email type="email" value="kamal@example.com" autocomplete="off"></label><label class="field">Sample password<input data-login-password type="password" value="ExamplePassword123!" autocomplete="off"></label></div><button class="btn primary" data-login-action="login" style="margin-top:12px">Simulate login →</button><div class="row" style="margin-top:17px"><label class="field">Protected request scenario<select data-token-scenario><option value="valid">Valid token</option><option value="expired">Expired token</option><option value="invalid">Invalid signature</option><option value="missing">Missing token</option><option value="forbidden">Other user's resource</option></select></label><button class="btn" data-login-action="protected">GET /users/me →</button><button class="btn ghost" data-login-action="clear">Clear token</button></div><pre class="output" data-login-output aria-live="polite">Login කර memory-only DEMO token එක ලබාගන්න.</pre>${simNote()}<p class="small muted">මෙහි fixed sample values සමග equality check එකක් පමණක් කරයි. Real Argon2 hashing හෝ cryptographic JWT signing/verification සිදු නොවේ. නිවැරදි Python implementation එක core/security.py හි බලන්න.</p></div>`;}
function loginAction(root,action){const out=$('[data-login-output]',root);if(action==='clear'){demoToken=null;output(out,'Memory-only demo token ඉවත් කළා. සැබෑ signed JWT එකක logout/revocation policy වෙනම අවශ්‍යය.');return;}if(action==='login'){const email=$('[data-login-email]',root).value.trim(),pw=$('[data-login-password]',root).value;if(email!=='kamal@example.com'||pw!=='ExamplePassword123!'){demoToken=null;output(out,'401 Unauthorized\n{"detail":"Invalid credentials"}\nUnknown email සහ incorrect password සඳහා එකම message එකයි.',true);return;}demoToken={sub:'1',exp:Date.now()+30*60*1000,value:'DEMO-NOT-A-REAL-JWT'};output(out,'200 OK\n{"access_token":"DEMO-NOT-A-REAL-JWT", "token_type":"bearer"}\nConceptual claims: sub="1", expiry=30 minutes\nමෙය cryptographic token එකක් නොවේ.');return;}const scenario=$('[data-token-scenario]',root).value;if(scenario==='missing'||!demoToken){output(out,'401 Unauthorized · Bearer token නොමැත.\nමුලින් sample login එක සාර්ථක කරන්න.',true);return;}if(scenario==='expired'||Date.now()>demoToken.exp){output(out,'401 Unauthorized · Token expired.\nexp claim එක verify කිරීමෙන් කල් ඉකුත් token ප්‍රතික්ෂේප කරයි.',true);return;}if(scenario==='invalid'){output(out,'401 Unauthorized · Invalid token signature.\nPayload කියවිය හැකි වුවත් identity විශ්වාස කළ නොහැක.',true);return;}if(scenario==='forbidden'){output(out,'403 Forbidden · User 1ට User 2ගේ resource එකට අවසර නැත.\nAuthentication සාර්ථකයි; Authorization අසාර්ථකයි.',true);return;}output(out,'200 OK\n{"id":1,"full_name":"Kamal Perera","email":"kamal@example.com"}\nBearer extraction → signature/exp/sub verification → current user → permission check.');}
function relationWidget(){return`<div data-relations><h3>Relationship explorer</h3><label class="field">Relationship type<select data-relation-select><option value="one-many">One-to-many · Department → Students</option><option value="one-one">One-to-one · User → Profile</option><option value="many-many">Many-to-many · Students ↔ Courses</option></select></label><div data-relation-visual style="margin-top:20px"></div><div class="inspector" data-relation-detail aria-live="polite"></div>${simNote()}</div>`;}
function paintRelation(root,type='one-many'){const labels=type==='one-many'?['Department','Student']:type==='one-one'?['User','Profile']:['Student','Course'];$('[data-relation-visual]',root).innerHTML=`<svg class="relation-svg" viewBox="0 0 600 180" role="img" aria-label="${labels[0]} to ${labels[1]} ${type} relationship"><g class="relation-node" tabindex="0" role="button" aria-label="Inspect ${labels[0]}" data-relation-node="parent"><rect x="20" y="20" width="180" height="130" rx="10"/><text x="40" y="50">${labels[0]}</text><text x="40" y="85">id · PRIMARY KEY</text><text x="40" y="115">name</text></g><path d="M200 85h190m-10-7 10 7-10 7"/><text x="250" y="70">${type==='one-many'?'1 → many':type==='one-one'?'1 → 1':'many ↔ many'}</text><g class="relation-node" tabindex="0" role="button" aria-label="Inspect ${labels[1]}" data-relation-node="child"><rect x="390" y="20" width="190" height="130" rx="10"/><text x="410" y="50">${labels[1]}</text><text x="410" y="85">id · PRIMARY KEY</text><text x="410" y="115">${type==='one-many'?'department_id · FK':type==='one-one'?'user_id · FK UNIQUE':'association table'}</text></g></svg>`;const info=type==='one-many'?['department_id = mapped_column(ForeignKey("departments.id"))','Department.students list එක සහ Student.department scalar attribute එක back_populates මඟින් සම්බන්ධ වේ. ForeignKey එක database reference එක enforce කරයි.']:type==='one-one'?['user_id = mapped_column(ForeignKey("users.id"), unique=True)','එක User කෙනෙකුට Profile එකක් පමණක් තිබිය හැකි බව UNIQUE(user_id) database constraint එක enforce කරයි.']:['student_courses(student_id FK, course_id FK, PRIMARY KEY(student_id, course_id))','Association table එක සම්බන්ධතාවක එක් pair එකක් එක් row එකක තබයි. JOIN මඟින් related courses ලබාගත හැක.'];$('[data-relation-detail]',root).innerHTML=`<p>${esc(info[1])}</p><code>${esc(info[0])}</code><p style="margin-top:12px">Table එකක් ඔබා ඒ පැත්තේ වගකීම බලන්න.</p>`;root.dataset.relation=type;}

function renderPractice(){const s=stats();return pageHead('PRACTICE MAKES IT CLICK','දැනුම භාවිතා කරමු','Code කියවීම, හිස්තැන් සම්පූර්ණ කිරීම, flow sequencing සහ concept checks. Hint එකක් ලබාගෙන නැවත උත්සාහ කරන්න. පිළිතුර විවෘත කළ පමණින් ලකුණු නොලැබේ.')+`<div class="practice-banner"><img src="${LEARNING_ART.practice}" alt="A golden star above colorful learning books" width="1254" height="1254"><div><span class="section-kicker">TURN UNDERSTANDING INTO CONFIDENCE</span><h3>ඉගෙන ගත් දේ, කරලා බලමු.</h3><p>එක exercise එකක් තෝරන්න. උත්සාහ කරන්න. Hint එකක් බලලා, නැවත උත්සාහ කරන්න.</p></div></div><div class="card"><div class="progress-stats"><div><b>${s.passed}</b><span>activities passed</span></div><div><b>${LESSONS.length+LABS.length}</b><span>interactive exercises</span></div><div><b>${s.attempted}</b><span>activities attempted</span></div></div><div class="row"><label class="field" style="flex:1">Module<select id="practice-module"><option value="all">All modules</option>${COURSE_MODULES.map(m=>`<option value="${m.id}">${m.id+1}. ${esc(m.en)}</option>`).join('')}</select></label><label class="field">Status<select id="practice-status"><option value="all">All activities</option><option value="todo">To practice</option><option value="passed">Passed</option></select></label></div></div><div id="practice-list" class="stack section-space"></div><section class="card section-space">${codeLabWidget()}</section>`;}
function paintPractice(){const mod=$('#practice-module').value,status=$('#practice-status').value;const ls=LESSONS.filter(l=>(mod==='all'||l.module===Number(mod))&&(status==='all'||(status==='passed')===!!state.exercises['lesson-'+l.id]?.passed));$('#practice-list').innerHTML=ls.map(l=>`<div><div class="row between" style="margin-bottom:8px"><span class="eyebrow">MODULE ${String(l.module+1).padStart(2,'0')} · ${esc(MODULES[l.module].en)}</span><button class="text-btn" data-lesson="${l.id}">Related lesson →</button></div>${exerciseWidget(l.exercise,'lesson-'+l.id)}</div>`).join('')||'<div class="empty">මෙම filter එකට ගැළපෙන exercises නැත.</div>';}

function renderProgress(){const s=stats();return pageHead('YOUR LEARNING JOURNEY','ඔබේ ඉදිරියට යන ගමන','පාඩම අවසානයේ “පාඩම අවසන් කළා” ඔබා completion එක සුරකින්න. Core පාඩම් 48 overall percentage එකට අදාළ වේ. Optional Docker පාඩම් 2 නොකළත් core course එක 100% සම්පූර්ණ කළ හැක. Exercise එකක් pass වීම සහ lesson completion වෙන වෙනම track කරයි.')+`<section class="card"><div class="progress-stats">${[[s.percent+'%','course complete'],[s.completed+'/'+CORE_LESSONS.length,'lessons completed'],[s.modules+'/'+CORE_MODULES.length,'modules completed'],[s.passed,'activities passed']].map(([n,t])=>`<div><b>${n}</b><span>${t}</span></div>`).join('')}</div><div class="progressbar"><span style="width:${s.percent}%"></span></div><div class="row between"><button class="btn primary" data-lesson="${state.last}">Continue learning →</button><button class="btn ghost danger" id="progress-reset-page">Reset progress</button></div></section><div class="stack section-space">${COURSE_MODULES.map(m=>{const n=m.lessons.filter(l=>state.completed.includes(l.id)).length;return`<section class="card"><div class="row between"><h3 style="margin:0">${moduleLabel(m)} · ${esc(m.en)}</h3><span class="pill ${n===2?'green':'blue'}">${n} / 2 lessons</span></div><div class="progressbar"><span style="width:${n*50}%"></span></div>${m.lessons.map(l=>`<button class="mini-link" data-lesson="${l.id}">${state.completed.includes(l.id)?'✓':'○'} ${esc(l.title)} <span class="cyan">${state.exercises['lesson-'+l.id]?.passed?'· exercise passed':''}</span></button>`).join('')}</section>`}).join('')}</div>`;}

async function copyFile(name){const text=FILES[name].lines.join('\n');try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);}else{const input=document.createElement('textarea');input.value=text;input.style.position='fixed';input.style.left='-9999px';document.body.append(input);input.select();const ok=document.execCommand('copy');input.remove();if(!ok)throw Error('copy');}toast('Educational code copied.');}catch{toast('Clipboard access නොලැබේ. Code එක select කර copy කරන්න.');}}

 const b=e.target.closest('button,a[data-page],tr[data-transform-step]');if(!b||b.disabled)return;
